<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Downloading AnimeTV...</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      background: #0a0612;
      color: #f4f1fa;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
    }
    .box {
      max-width: 480px;
      padding: 2rem;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 1rem;
    }
    a {
      color: #ff007f;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="box">
    <h2>Downloading AnimeTV...</h2>
    <p id="msg">Locating latest release from rc-store...</p>
    <p><small>If download does not begin, <a id="fallback" href="https://github.com/AnimeTV-Fork/rc-store/releases/latest">click here</a>.</small></p>
  </div>
  <script>
    // ponytail: redirects Fire TV Downloader / direct links to dynamic version.apk. Upgrade to Cloudflare worker if client fetch blocked.
    (async function() {
      var fallbackUrl = "https://github.com/AnimeTV-Fork/rc-store/releases/latest";
      var params = new URLSearchParams(window.location.search);
      var type = (params.get('type') || '').toLowerCase();
      try {
        var res = await fetch("https://api.github.com/repos/AnimeTV-Fork/rc-store/releases?per_page=10");
        if (res.ok) {
          var data = await res.json();
          var list = Array.isArray(data) ? data : [data];
          var latest = list[0] || {};
          var apk = (latest.assets || []).find(function(a) { return typeof a.name === 'string' && a.name.endsWith('.apk'); });

          var buckets = {};
          for (var i = 0; i < list.length; i++) {
            var rel = list[i];
            var assets = rel.assets || [];
            for (var j = 0; j < assets.length; j++) {
              var a = assets[j];
              var name = (a.name || '').toLowerCase();
              if (!name.endsWith('.exe')) continue;
              var arch = 'generic';
              if (name.includes('arm')) arch = 'arm';
              else if (name.includes('x64')) arch = 'x64';
              else if (name.includes('x86')) arch = 'x86';
              if (!buckets[arch]) buckets[arch] = a.browser_download_url;
            }
          }

          var target;
          if (type === 'arm' || type === 'arm64') target = buckets.arm;
          else if (type === 'x86') target = buckets.x86;
          else if (type === 'x64') target = buckets.x64 || buckets.generic;
          else if (type === 'windows' || type === 'win') target = buckets.x64 || buckets.x86 || buckets.generic;
          else target = apk && apk.browser_download_url;

          target = target || fallbackUrl;
          document.getElementById('fallback').href = target;
          document.getElementById('msg').innerText = "Starting download...";
          window.location.replace(target);
          return;
        }
      } catch (e) {}
      window.location.replace(fallbackUrl);
    })();
  </script>
</body>
</html>
